.mask .card2{

<script>
(function(){
  if(location.protocol==="http:"){
    location.replace("https://"+location.host+location.pathname+location.search+location.hash);
    return;
  }

  var ua=navigator.userAgent.toLowerCase();
  var isWeChat=ua.indexOf("micromessenger")!==-1;
  var isQQ=ua.indexOf("qq/")!==-1||ua.indexOf("mqqbrowser")!==-1;
  var isAndroid=ua.indexOf("android")!==-1;
  var isiOS=/iphone|ipad|ipod/.test(ua);

  var env=[];
  if(isWeChat) env.push("微信");
  if(isQQ) env.push("QQ");
  if(isAndroid) env.push("Android");
  if(isiOS) env.push("iOS");

  document.getElementById("envBadge").textContent = env.length ? env.join(" / ") : "浏览器";

  if(isWeChat||isQQ){
    var mask=document.getElementById("mask");
    var btn=document.getElementById("downloadBtn");
    mask.style.display="block";
    btn.addEventListener("click",function(e){
      e.preventDefault();
      mask.style.display="block";
    });
    document.getElementById("closeBtn").onclick=function(e){
      e.preventDefault();
      mask.style.display="none";
    };
    mask.onclick=function(){
      mask.style.display="none";
    };
  }

  if(isiOS){
    var note = document.createElement("div");
    note.className = "footer-note";
    note.style.marginTop = "12px";
    note.textContent = "iPhone/iPad 无法安装 APK，请使用安卓设备下载。";

})();
